<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Bel Cerdas Cermat</title>
    <!-- Menggunakan Google Fonts untuk tampilan yang lebih modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        /* Kotak Pengumuman Pemenang */
        #pengumuman {
            background-color: #fff;
            border: 3px dashed #ccc;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: 600;
            color: #555;
            margin-bottom: 30px;
            text-align: center;
            min-width: 350px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        #pengumuman.aktif {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
            animation: pop 0.3s ease;
        }
        @keyframes pop {
            0% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        /* Layout Tombol Peserta */
        .container-peserta {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-peserta {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            font-size: 28px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            transition: 0.2s;
        }
        .btn-peserta:active {
            transform: scale(0.95);
        }
        #btn-A { background-color: #ff4757; } /* Merah */
        #btn-B { background-color: #2ed573; } /* Hijau */
        #btn-C { background-color: #1e90ff; } /* Biru */

        /* Tombol Reset Juri */
        .btn-reset {
            background-color: #ffa502;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .btn-reset:hover {
            background-color: #e58e00;
        }
    </style>
</head>
<body>

    <h1>🔔 Bel Cerdas Cermat</h1>
    
    <!-- Layar Pengumuman Pemenang -->
    <div id="pengumuman">Menunggu peserta menekan bel...</div>

    <!-- Tombol untuk Peserta A, B, dan C -->
    <div class="container-peserta">
        <button id="btn-A" class="btn-peserta" onclick="tekanBel('Tim A')">TIM A</button>
        <button id="btn-B" class="btn-peserta" onclick="tekanBel('Tim B')">TIM B</button>
        <button id="btn-C" class="btn-peserta" onclick="tekanBel('Tim C')">TIM C</button>
    </div>

    <!-- Tombol Reset untuk Juri -->
    <button class="btn-reset" onclick="resetBel()">🔄 Reset Bel (Juri)</button>

    <script>
        // Fungsi saat peserta menekan tombol bel
        function tekanBel(tim) {
            fetch('/tekan/' + tim, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    console.log(data);
                });
        }

        // Fungsi saat juri mereset bel
        function resetBel() {
            fetch('/reset', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    console.log("Bel direset");
                });
        }

        // Fungsi pengecekan status otomatis setiap 0.1 detik (100 ms) agar real-time
        setInterval(function() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    const kotak = document.getElementById('pengumuman');
                    if (data.pemenang) {
                        kotak.innerText = "🎉 " + data.pemenang + " yang paling cepat! 🎉";
                        kotak.classList.add('aktif');
                    } else {
                        kotak.innerText = "Menunggu peserta menekan bel...";
                        kotak.classList.remove('aktif');
                    }
                });
        }, 100);
    </script>

</body>
</html>
